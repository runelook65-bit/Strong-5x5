name: Verify Guided Exercise UI
on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/ui-v09.css'
      - 'tests/**'
      - 'docs/UI_V09.md'
      - '.github/workflows/verify-guided-ui.yml'
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regression tests
        run: npm test
      - name: Vite build without deploy
        run: npm run build
