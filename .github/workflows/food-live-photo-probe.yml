name: One-shot public food photo model smoke test
on:
  push:
    branches:
      - feat/cal-ai-portion-review
    paths:
      - '.github/workflows/food-live-photo-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-food-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe deployed free-model endpoint with two Creative Commons meal photographs
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, urllib.request, urllib.error, sys, time
          source = [
            ('menemen', 'https://commons.wikimedia.org/wiki/Special:Redirect/file/MenemenIstanbul.jpg'),
            ('spaghetti', 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Spaghetti_bolognese.jpg')
          ]
          endpoint='https://arm-5x5.vercel.app/api/food/analyze'
          problems=[]
          for label,url in source:
            try:
              get=urllib.request.Request(url,headers={'User-Agent':'StrongFitsNutritionSmoke/1.0 (meal photo quality check)'})
              with urllib.request.urlopen(get,timeout=25) as response:
                image=response.read(1_300_000)
              if not image.startswith(b'\\xff\\xd8'):
                raise ValueError('Downloaded fixture is not a JPEG')
              payload=json.dumps({'image':base64.b64encode(image).decode(),'mediaType':'image/jpeg','hint':''}).encode()
              req=urllib.request.Request(endpoint,data=payload,headers={
                'Content-Type':'application/json','Origin':'https://arm-5x5.vercel.app','User-Agent':'StrongFitsNutritionSmoke/1.0'
              },method='POST')
              try:
                with urllib.request.urlopen(req,timeout=70) as response:
                  code=response.status
                  result=json.load(response)
              except urllib.error.HTTPError as error:
                code=error.code
                result=json.loads(error.read(1500).decode(errors='replace') or '{}')
              if code!=200:
                print(json.dumps({'fixture':label,'status':code,'error':result.get('error','http_error')}))
                problems.append(f'{label}: HTTP {code}')
                continue
              items=result.get('items',[])
              kcal=sum(float(x.get('kcal',0)) for x in items)
              valid=result.get('is_food') is True and len(items)>0 and 50<=kcal<=1500 and all(
                x.get('name') and float(x.get('grams',0))>0 and all(float(x.get(k,0))>=0 for k in ['protein','carbs','fat'])
                for x in items
              )
              print(json.dumps({'fixture':label,'status':code,'is_food':result.get('is_food'),
                'name':result.get('name'),'items':len(items),'kcal':round(kcal),'confidence':result.get('confidence'),
                'sanity_pass':valid},ensure_ascii=False))
              if not valid:problems.append(f'{label}: implausible or incomplete structured output')
            except Exception as error:
              print(json.dumps({'fixture':label,'exception':type(error).__name__,'message':str(error)[:180]}))
              problems.append(f'{label}: {type(error).__name__}')
          if problems:
            print('Live model smoke test NOT VERIFIED:', '; '.join(problems))
            sys.exit(1)
          print('Live photo smoke test PASSED. Calorie accuracy is NOT established by these checks.')
          PY
