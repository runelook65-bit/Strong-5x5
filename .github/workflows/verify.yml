name: Verify StrongLifts HTML Baseline
on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.mjs'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regression tests
        run: npm test
      - name: Production PWA build (no deploy)
        run: npm run build
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stronglifts-html-baseline
          path: dist/
